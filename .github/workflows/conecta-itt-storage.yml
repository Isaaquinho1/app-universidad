name: Conecta ITT - Pruebas de almacenamiento y permisos

on:
  push:
    branches:
      - refactor/conecta-itt-identity
    paths:
      - 'packages/storage/**'
      - 'packages/permission_client/**'
      - '.github/workflows/conecta-itt-storage.yml'

  pull_request:
    branches:
      - main
      - refactor/conecta-itt-identity
    paths:
      - 'packages/storage/**'
      - 'packages/permission_client/**'
      - '.github/workflows/conecta-itt-storage.yml'

permissions:
  contents: read

jobs:
  storage-tests:
    name: Validar almacenamiento y permisos
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Instalar dependencias del workspace
        run: flutter pub get

      - name: Verificar análisis estático
        run: |
          dart analyze packages/storage/storage
          dart analyze packages/storage/persistent_storage
          dart analyze packages/storage/secure_storage
          dart analyze packages/permission_client

      - name: Verificar formato Dart
        run: |
          dart format --page-width=80 --output=none --set-exit-if-changed \
            packages/storage/storage/lib \
            packages/storage/storage/test \
            packages/storage/persistent_storage/lib \
            packages/storage/persistent_storage/test \
            packages/storage/secure_storage/lib \
            packages/storage/secure_storage/test \
            packages/permission_client/lib \
            packages/permission_client/test

      - name: Ejecutar pruebas de almacenamiento y permisos
        run: |
          flutter test \
            packages/storage/storage/test/storage_test.dart \
            packages/storage/persistent_storage/test/persistent_storage_test.dart \
            packages/storage/secure_storage/test/secure_storage_test.dart \
            packages/permission_client/test/src/permission_client_test.dart
