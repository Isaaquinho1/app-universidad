  dart_style: 2.3.6
  build_verify: any
  custom_lint: any




flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/conecta_itt_app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/conecta_itt_adaptive_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - shorebird.yaml

dependency_overrides:
  share_plus_platform_interface: ^6.1.0
  analyzer: 6.4.1           
  build: 2.4.1              
  build_runner: 2.4.13      
  build_resolvers: 2.4.2    
  dart_style: 2.3.6         
  source_gen: 1.5.0         
  go_router_builder: 2.3.4  
  freezed: 2.4.7            
  freezed_annotation: 2.4.1 
  json_serializable: 6.7.1  
  json_annotation: 4.8.1    
  envied_generator: 1.1.0   
  flutter_gen_runner: 5.4.0 
  flutter_gen_core: 5.4.0   
  protobuf: ^3.1.0
  grpc: any
  hugeicons: 1.1.5                   # Evita que los IconData muten a List
  smooth_sheets: 0.15.0                    # <-- Cura el error de PbList en NFC
  font_awesome_flutter: 11.0.0       # <-- Cura el error de IconData
  enough_platform_widgets:
    path: ./packages/enough_platform_widgets
  

